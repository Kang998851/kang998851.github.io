<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment complete · KangStudio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="KangStudio home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <path fill="#0a0a0a" d="M9 7.25h4.35v7.2L20.55 7.25H25L17.15 15.35 25.35 24.75h-4.5l-7.5-8.55v8.55H9V7.25z"/>
          <path fill="currentColor" d="M21.15 9.05h2.55l-4.05 4.55-1.2-1.35 2.7-3.2z"/>
        </svg>
        <span class="brand-word"><span class="brand-kang">Kang</span><span class="brand-studio">Studio</span></span>
      </a>
    </div>
  </header>
  <main class="section legal-page">
    <p class="eyebrow">Checkout</p>
    <h1 id="success-title">Checking payment…</h1>
    <p id="success-copy">Confirming the Stripe charge.</p>
    <p class="license-box" id="license-box" hidden>
      <label class="field-label" for="license">License for the desktop app</label>
      <input class="field" id="license" readonly>
      <button class="btn btn-solid" type="button" id="copy-license">Copy license</button>
    </p>
    <p class="hero-actions"><a class="btn btn-ghost" href="index.html#download">Back to download</a></p>
  </main>
  <script src="checkout-success.js"></script>
</body>
</html>
